server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: cuenote-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cuenote}
    username: ${SPRING_DATASOURCE_USERNAME:cuenote}
    password: ${SPRING_DATASOURCE_PASSWORD:cuenote_dev_password}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

cuenote:
  version: ${APP_VERSION:0.1.0}
  musicxml:
    max-bytes: ${CUENOTE_MUSICXML_MAX_BYTES:2097152}
  object-storage:
    type: ${CUENOTE_OBJECT_STORAGE_TYPE:local}
    local-root: ${CUENOTE_OBJECT_STORAGE_LOCAL_ROOT:target/object-storage}
    minio:
      endpoint: ${CUENOTE_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${CUENOTE_MINIO_ACCESS_KEY:cuenote}
      secret-key: ${CUENOTE_MINIO_SECRET_KEY:cuenote_dev_minio_password}
      bucket: ${CUENOTE_MINIO_BUCKET:cuenote-scores}
