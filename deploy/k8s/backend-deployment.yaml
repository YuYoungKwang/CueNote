apiVersion: apps/v1
kind: Deployment
metadata:
  name: cuenote-backend
  namespace: cuenote
  labels:
    app.kubernetes.io/name: cuenote-backend
    app.kubernetes.io/part-of: cuenote
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cuenote-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cuenote-backend
        app.kubernetes.io/part-of: cuenote
    spec:
      containers:
        - name: backend
          image: ghcr.io/your-org/cuenote-backend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: "0.1.0"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: cuenote-backend-secret
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cuenote-backend-secret
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cuenote-backend-secret
                  key: SPRING_DATASOURCE_PASSWORD
            - name: CUENOTE_OBJECT_STORAGE_LOCAL_ROOT
              value: /data/object-storage
            - name: CUENOTE_MUSICXML_MAX_BYTES
              value: "2097152"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: object-storage
              mountPath: /data/object-storage
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
        - name: object-storage
          emptyDir: {}
