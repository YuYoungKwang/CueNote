apiVersion: v1
kind: Secret
metadata:
  name: cuenote-backend-secret
  namespace: cuenote
  labels:
    app.kubernetes.io/name: cuenote-backend
    app.kubernetes.io/part-of: cuenote
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres.cuenote.svc.cluster.local:5432/cuenote
  SPRING_DATASOURCE_USERNAME: cuenote
  SPRING_DATASOURCE_PASSWORD: replace-with-cluster-secret
  MINIO_ROOT_USER: cuenote
  MINIO_ROOT_PASSWORD: replace-with-cluster-minio-secret
