name: cuenote

services:
  postgres:
    image: postgres:16-alpine
    container_name: cuenote-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cuenote}
      POSTGRES_USER: ${POSTGRES_USER:-cuenote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cuenote_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
