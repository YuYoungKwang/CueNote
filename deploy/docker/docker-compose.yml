name: cuenote

services:
  postgres:
    image: postgres:16-alpine
    container_name: cuenote-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cuenote}
      POSTGRES_USER: ${POSTGRES_USER:-cuenote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cuenote_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: cuenote-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cuenote}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cuenote_dev_minio_password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  minio-data:
